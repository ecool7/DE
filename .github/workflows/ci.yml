# CI под вакансию: автоматические тесты данных/кода на каждый push/PR
name: rshb-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Bootstrap test stand + raw data
        run: |
          python scripts/bootstrap_stands.py
          python scripts/generate_raw_data.py --business-dt 2026-10-16

      - name: Unit + DQ tests
        env:
          RSHB_ENV: test
        run: pytest tests -q
